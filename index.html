<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: #3372BB;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            border: 5px solid #b8bdff
        }

        main {
            background-color: #FFFFFF;
            color: #002147;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
        }

        img {
            width: 300px;
            height: 300px;
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Meu blog voleibol</h1>
    </header>
    <main>
        <article>      
                <img src="imagemblog.jpeg"
                alt="Ilustração de jogadora de vôlei com uniforme azul e o número 7, se preparando para atacar a bola. Na parte inferior, uma faixa azul escura exibe o texto">
                <div>
                    <p class="artigo-autor">Por: Jujudopix </p>
                    <p>Bem vindo ao meu blog! Aqui vou compartilhar conhecimentos sobre o voleibol</p>
                    <button>​❤️​ ​​<span>0</span></button>
                    <button>​​👎🏼​ ​​<span>0</span></button>
                </div>
    <main>

        </article>
        <article>
            <img src="imagemblog.jpeg"
            alt="Ilustração de jogadora de vôlei com uniforme azul e o número 7, se preparando para atacar a bola. Na parte inferior, uma faixa azul escura exibe o texto ">
            <div>
            <p class="artigo-autor">Por: Jujudopix </p>
            <p>Bem vindo ao meu blog! Aqui vou compartilhar conhecimentos sobre o voleibol</p>
            <button>​❤️​ ​​<span>0</span></button>
            <button>​​👎🏼​ ​​<span>0</span></button>
            </div>

        </article>


        </main>
</body>
<script>
    const botoes = document.querySelectorAll("button")

    botoes.forEach(function (botao) {
        let curtiu = false;
        botao.addEventListener("click", botaoClicado)
        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            if (curtiu === false){
                texto.textContent++;
                curtiu = true;
            } else{
                texto.textContent--;
                curtiu = false;
            }
        }

    })


</script>

</html>
